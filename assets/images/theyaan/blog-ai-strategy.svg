<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 373 268" fill="none">
  <defs>
    <linearGradient id="bs-bg" x1="0" y1="0" x2="373" y2="268" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="bs-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F800FF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
  </defs>
  <rect width="373" height="268" fill="url(#bs-bg)"/>
  <!-- Abstract network graph -->
  <g opacity="0.08" stroke="#F800FF" stroke-width="0.5">
    <line x1="0" y1="50" x2="373" y2="50"/><line x1="0" y1="100" x2="373" y2="100"/>
    <line x1="0" y1="150" x2="373" y2="150"/><line x1="0" y1="200" x2="373" y2="200"/>
  </g>
  <!-- Bar chart / analytics -->
  <g transform="translate(100,50)">
    <rect x="0" y="90" width="24" height="80" rx="3" fill="#F800FF" opacity="0.25"/>
    <rect x="35" y="60" width="24" height="110" rx="3" fill="#7C4DFF" opacity="0.3"/>
    <rect x="70" y="100" width="24" height="70" rx="3" fill="#F800FF" opacity="0.2"/>
    <rect x="105" y="40" width="24" height="130" rx="3" fill="#7C4DFF" opacity="0.35"/>
    <rect x="140" y="75" width="24" height="95" rx="3" fill="#F800FF" opacity="0.28"/>
    <!-- Trend line -->
    <polyline points="12,85 47,55 82,95 117,35 152,70"
      stroke="white" stroke-width="1.5" fill="none" opacity="0.5"/>
    <!-- Dots on trend -->
    <circle cx="12" cy="85" r="3" fill="white" opacity="0.6"/>
    <circle cx="47" cy="55" r="3" fill="white" opacity="0.6"/>
    <circle cx="82" cy="95" r="3" fill="white" opacity="0.6"/>
    <circle cx="117" cy="35" r="3" fill="white" opacity="0.6"/>
    <circle cx="152" cy="70" r="3" fill="white" opacity="0.6"/>
  </g>
  <!-- "85%" text -->
  <text x="186" y="235" font-family="sans-serif" font-size="28" font-weight="700" fill="#F800FF" opacity="0.25" text-anchor="middle">85%</text>
  <!-- Floating elements -->
  <circle cx="50" cy="60" r="4" fill="#F800FF" opacity="0.3"/>
  <circle cx="330" cy="50" r="3" fill="#7C4DFF" opacity="0.25"/>
  <circle cx="40" cy="220" r="3" fill="#7C4DFF" opacity="0.2"/>
  <circle cx="340" cy="230" r="4" fill="#F800FF" opacity="0.2"/>
  <!-- Glow -->
  <circle cx="186" cy="134" r="70" fill="#F800FF" opacity="0.04"/>
</svg>
