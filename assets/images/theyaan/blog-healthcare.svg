<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 373 268" fill="none">
  <defs>
    <linearGradient id="bh-bg" x1="0" y1="0" x2="373" y2="268" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0a2028"/>
    </linearGradient>
  </defs>
  <rect width="373" height="268" fill="url(#bh-bg)"/>
  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#02D6E4" stroke-width="0.5">
    <line x1="0" y1="40" x2="373" y2="40"/><line x1="0" y1="80" x2="373" y2="80"/>
    <line x1="0" y1="120" x2="373" y2="120"/><line x1="0" y1="160" x2="373" y2="160"/>
    <line x1="0" y1="200" x2="373" y2="200"/><line x1="0" y1="240" x2="373" y2="240"/>
  </g>
  <!-- Edge device illustration -->
  <g transform="translate(120,55)">
    <!-- Central chip/device -->
    <rect x="30" y="30" width="70" height="70" rx="8" fill="#02D6E4" opacity="0.1" stroke="#02D6E4" stroke-width="1.5"/>
    <!-- Chip inner -->
    <rect x="45" y="45" width="40" height="40" rx="4" fill="#02D6E4" opacity="0.15"/>
    <!-- Chip pins -->
    <line x1="55" y1="30" x2="55" y2="20" stroke="#02D6E4" stroke-width="1.5" opacity="0.4"/>
    <line x1="75" y1="30" x2="75" y2="20" stroke="#02D6E4" stroke-width="1.5" opacity="0.4"/>
    <line x1="55" y1="100" x2="55" y2="110" stroke="#02D6E4" stroke-width="1.5" opacity="0.4"/>
    <line x1="75" y1="100" x2="75" y2="110" stroke="#02D6E4" stroke-width="1.5" opacity="0.4"/>
    <line x1="30" y1="55" x2="20" y2="55" stroke="#02D6E4" stroke-width="1.5" opacity="0.4"/>
    <line x1="30" y1="75" x2="20" y2="75" stroke="#02D6E4" stroke-width="1.5" opacity="0.4"/>
    <line x1="100" y1="55" x2="110" y2="55" stroke="#02D6E4" stroke-width="1.5" opacity="0.4"/>
    <line x1="100" y1="75" x2="110" y2="75" stroke="#02D6E4" stroke-width="1.5" opacity="0.4"/>
    <!-- Signal waves from chip -->
    <path d="M115 50 C125 50 125 65 115 65" stroke="#02D6E4" stroke-width="1" fill="none" opacity="0.3"/>
    <path d="M120 45 C135 45 135 70 120 70" stroke="#02D6E4" stroke-width="1" fill="none" opacity="0.2"/>
    <!-- "EDGE" label -->
    <text x="65" y="70" font-family="monospace" font-size="10" font-weight="700" fill="#02D6E4" text-anchor="middle" opacity="0.6">EDGE</text>
    <!-- "AI" label -->
    <text x="65" y="82" font-family="monospace" font-size="8" fill="white" text-anchor="middle" opacity="0.4">AI</text>
  </g>
  <!-- Connection to satellite nodes -->
  <circle cx="60" cy="70" r="12" fill="#02D6E4" fill-opacity="0.08" stroke="#02D6E4" stroke-width="0.8" stroke-opacity="0.2"/>
  <circle cx="310" cy="60" r="12" fill="#02D6E4" fill-opacity="0.08" stroke="#02D6E4" stroke-width="0.8" stroke-opacity="0.2"/>
  <circle cx="55" cy="200" r="12" fill="#02D6E4" fill-opacity="0.08" stroke="#02D6E4" stroke-width="0.8" stroke-opacity="0.2"/>
  <circle cx="320" cy="195" r="12" fill="#02D6E4" fill-opacity="0.08" stroke="#02D6E4" stroke-width="0.8" stroke-opacity="0.2"/>
  <!-- Dashed connections -->
  <line x1="72" y1="70" x2="150" y2="100" stroke="#02D6E4" stroke-width="0.7" stroke-dasharray="4 4" opacity="0.15"/>
  <line x1="298" y1="60" x2="230" y2="100" stroke="#02D6E4" stroke-width="0.7" stroke-dasharray="4 4" opacity="0.15"/>
  <line x1="67" y1="200" x2="150" y2="160" stroke="#02D6E4" stroke-width="0.7" stroke-dasharray="4 4" opacity="0.15"/>
  <line x1="308" y1="195" x2="230" y2="160" stroke="#02D6E4" stroke-width="0.7" stroke-dasharray="4 4" opacity="0.15"/>
  <!-- "0 connectivity" text -->
  <text x="186" y="245" font-family="monospace" font-size="11" fill="#02D6E4" opacity="0.2" text-anchor="middle">ZERO CONNECTIVITY</text>
  <!-- Glow -->
  <circle cx="186" cy="134" r="65" fill="#02D6E4" opacity="0.04"/>
</svg>
