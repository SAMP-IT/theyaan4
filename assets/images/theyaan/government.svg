<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 340" fill="none">
  <defs>
    <linearGradient id="gv-bg" x1="0" y1="0" x2="570" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a1800"/>
    </linearGradient>
    <linearGradient id="gv-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FB6A15"/>
    </linearGradient>
  </defs>
  <rect width="570" height="340" fill="url(#gv-bg)"/>
  <!-- Circuit board pattern -->
  <g stroke="#FFB300" stroke-width="0.5" opacity="0.07">
    <path d="M0 170 H180 V100 H240"/>
    <path d="M570 170 H390 V100 H330"/>
    <path d="M0 200 H150 V260 H220"/>
    <path d="M570 200 H420 V260 H350"/>
    <path d="M240 100 V60 H330 V100"/>
    <path d="M220 260 V290 H350 V260"/>
    <circle cx="240" cy="100" r="3" fill="#FFB300"/>
    <circle cx="330" cy="100" r="3" fill="#FFB300"/>
    <circle cx="220" cy="260" r="3" fill="#FFB300"/>
    <circle cx="350" cy="260" r="3" fill="#FFB300"/>
    <circle cx="180" cy="170" r="2" fill="#FFB300"/>
    <circle cx="390" cy="170" r="2" fill="#FFB300"/>
  </g>
  <!-- Central bridge / SETU icon -->
  <g transform="translate(195,90)">
    <circle cx="90" cy="80" r="60" fill="#FFB300" opacity="0.06"/>
    <circle cx="90" cy="80" r="42" fill="#FB6A15" opacity="0.06"/>
    <!-- Bridge structure -->
    <path d="M20 120 Q55 70 90 80 Q125 70 160 120" stroke="url(#gv-accent)" stroke-width="2.5" fill="none" opacity="0.7"/>
    <!-- Bridge pillars -->
    <line x1="50" y1="92" x2="50" y2="130" stroke="#FFB300" stroke-width="2" opacity="0.5"/>
    <line x1="90" y1="80" x2="90" y2="130" stroke="#FFB300" stroke-width="2" opacity="0.5"/>
    <line x1="130" y1="92" x2="130" y2="130" stroke="#FFB300" stroke-width="2" opacity="0.5"/>
    <!-- Bridge deck -->
    <line x1="20" y1="130" x2="160" y2="130" stroke="#FFB300" stroke-width="2.5" opacity="0.6"/>
    <!-- Data flow arrows on bridge -->
    <g opacity="0.5">
      <circle cx="60" cy="127" r="3" fill="#FFB300"/>
      <circle cx="80" cy="127" r="3" fill="#FB6A15"/>
      <circle cx="100" cy="127" r="3" fill="#FFB300"/>
      <circle cx="120" cy="127" r="3" fill="#FB6A15"/>
    </g>
    <!-- "Legacy" block left -->
    <rect x="0" y="55" width="40" height="30" rx="4" fill="#FFB300" opacity="0.12" stroke="#FFB300" stroke-width="1" />
    <line x1="8" y1="64" x2="32" y2="64" stroke="white" stroke-width="0.7" opacity="0.3"/>
    <line x1="8" y1="70" x2="28" y2="70" stroke="white" stroke-width="0.7" opacity="0.25"/>
    <line x1="8" y1="76" x2="24" y2="76" stroke="white" stroke-width="0.7" opacity="0.2"/>
    <!-- "Modern API" block right -->
    <rect x="140" y="55" width="40" height="30" rx="4" fill="#FB6A15" opacity="0.12" stroke="#FB6A15" stroke-width="1"/>
    <line x1="148" y1="64" x2="172" y2="64" stroke="white" stroke-width="0.7" opacity="0.3"/>
    <line x1="148" y1="70" x2="168" y2="70" stroke="white" stroke-width="0.7" opacity="0.25"/>
    <line x1="148" y1="76" x2="164" y2="76" stroke="white" stroke-width="0.7" opacity="0.2"/>
    <!-- Arrow from legacy to bridge -->
    <path d="M40 70 L50 80" stroke="#FFB300" stroke-width="1" opacity="0.4" marker-end="none"/>
    <!-- Arrow from bridge to modern -->
    <path d="M140 70 L130 80" stroke="#FB6A15" stroke-width="1" opacity="0.4"/>
    <!-- Shield icon in center -->
    <path d="M82 38 L90 32 L98 38 L98 52 C98 56 90 62 90 62 C90 62 82 56 82 52 Z"
      fill="url(#gv-accent)" opacity="0.35"/>
    <path d="M88 44 L90 48 L96 40" stroke="white" stroke-width="1.5" fill="none" opacity="0.7"/>
  </g>
  <!-- Floating nodes -->
  <circle cx="80" cy="80" r="4" fill="#FFB300" opacity="0.3"/>
  <circle cx="490" cy="90" r="5" fill="#FB6A15" opacity="0.25"/>
  <circle cx="70" cy="270" r="3" fill="#FFB300" opacity="0.2"/>
  <circle cx="500" cy="260" r="4" fill="#FB6A15" opacity="0.2"/>
  <!-- Subtle glow -->
  <circle cx="285" cy="170" r="85" fill="#FFB300" opacity="0.04"/>
</svg>
